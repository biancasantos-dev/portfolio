<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Tag lateral / ícone -->
  <g transform="translate(10, 15)">
    <!-- Ícone Box com estética neo-brutalist -->
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#ccff00" stroke="#0f172a" stroke-width="4" filter="url(#shadow)" />
    
    <!-- Símbolo de código < / > estilizado -->
    <path d="M42 38 L24 55 L42 72" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M68 38 L86 55 L68 72" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="58" y1="34" x2="52" y2="76" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Mini estrelinha -->
    <circle cx="55" cy="94" r="3" fill="#0f172a" />
    <circle cx="43" cy="94" r="2" fill="#0f172a" />
    <circle cx="67" cy="94" r="2" fill="#0f172a" />
  </g>

  <!-- Tipografia do Portfólio -->
  <g transform="translate(145, 20)">
    <!-- Nome principal -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      BIANCA<tspan fill="#2563eb">.DEV</tspan>
    </text>
    
    <!-- Subtítulo / Pílula -->
    <rect x="0" y="60" width="168" height="28" rx="8" fill="#0f172a" />
    <text x="84" y="79" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      PORTFÓLIO WEB
    </text>

    <!-- Versão / Edição badge -->
    <rect x="176" y="60" width="70" height="28" rx="8" fill="#eff6ff" stroke="#0f172a" stroke-width="2" />
    <text x="211" y="79" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">
      2026
    </text>
  </g>
</svg>
